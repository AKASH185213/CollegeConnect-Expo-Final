<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Class | CollegeConnect</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="form-page">
<header class="form-hero">
<div class="form-hero-inner">
<div class="section-kicker">FACULTY CONTROL CENTER</div>
<h1>Create Class Schedule</h1>
<p>Add a class to the weekly academic timetable.</p>
</div>
</header>
<main class="form-main">
<div class="form-navigation">
<a href="/admin" class="back-link">← Faculty Dashboard</a>
<a href="/timetable" class="secondary-link">View Class Timetable</a>
</div>
<section class="form-shell">
<div class="form-shell-heading">
<span class="eyebrow">NEW ENTRY</span>
<h2>Class details</h2>
<p>Fill in the details below and publish when everything is ready.</p>
</div>
<form method="POST" class="elegant-form">
<div class="form-field"><label for="day">Day</label><select id="day" name="day" required><option value="">Select day</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option></select></div>
<div class="form-field"><label for="time">Time</label><input id="time" type="time" name="time" required></div>
<div class="form-field"><label for="subject">Subject</label><input id="subject" type="text" name="subject" placeholder="Example: Engineering Mathematics" required></div>
<div class="form-field"><label for="faculty">Faculty</label><input id="faculty" type="text" name="faculty" placeholder="Example: Faculty name" required></div>
<div class="form-field"><label for="room">Room</label><input id="room" type="text" name="room" placeholder="Example: Room 203" required></div>
<button type="submit" class="form-submit"><span>Add Class</span><span>→</span></button>
</form>
</section>
</main>
</body>
</html>
