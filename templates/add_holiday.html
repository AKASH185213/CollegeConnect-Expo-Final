<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Holiday | CollegeConnect</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="form-page">
<header class="form-hero">
<div class="form-hero-inner">
<div class="section-kicker">FACULTY CONTROL CENTER</div>
<h1>Add Holiday</h1>
<p>Update the academic calendar with a new holiday.</p>
</div>
</header>
<main class="form-main">
<div class="form-navigation">
<a href="/admin" class="back-link">← Faculty Dashboard</a>
<a href="/holidays" class="secondary-link">View Holidays</a>
</div>
<section class="form-shell">
<div class="form-shell-heading">
<span class="eyebrow">NEW ENTRY</span>
<h2>Holiday details</h2>
<p>Fill in the details below and publish when everything is ready.</p>
</div>
<form method="POST" class="elegant-form">
<div class="form-field"><label for="name">Holiday Name</label><input id="name" type="text" name="name" placeholder="Example: Independence Day" required></div>
<div class="form-field"><label for="date">Date</label><input id="date" type="date" name="date" required></div>
<div class="form-field"><label for="description">Description</label><textarea id="description" name="description" placeholder="Example: College will remain closed." required></textarea></div>
<button type="submit" class="form-submit"><span>Add Holiday</span><span>→</span></button>
</form>
</section>
</main>
</body>
</html>
